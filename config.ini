; ============================================================
;  PowerModeSwitcher 配置文件
;  修改后需重启程序生效（右键托盘图标 -> 退出，再重新启动）
;  所有 .ico 文件名相对于本程序所在目录
; ============================================================

[General]
; 全局热键，循环切换模式。支持 Alt+Q 与 ^!q 两种写法
Hotkey=Alt+Q
; OSD 停留时长（毫秒）
OSD_Duration=900
; OSD 不透明度，0-255；235 约等于 92%（更实，压住花壁纸保证可读）
; 启动时是否用 OSD 报一次当前档（1=是，0=否）；双击 start.cmd 后能立刻看到它活着
OSD_OnStart=1
OSD_Opacity=235
; OSD 文字点数（96 DPI 基准，程序会按显示器 DPI 自动缩放）
OSD_FontSize=15
; OSD 距屏幕底部留白（96 DPI 基准像素）
OSD_BottomMargin=80
; 1 = 开机自启（在 shell:startup 放置快捷方式），0 = 关闭
StartWithWindows=1
; 1 = 托盘图标左键单击循环切换（0 = 左键弹出菜单）
TrayLeftClick=1
; 1 = 切电源档时同步切 GIGABYTE Control Center 的风扇模式
; 前提：本程序以管理员身份运行（GCC 是提权进程，不提权读不到它的界面）
;       且 GCC 窗口处于后台可见状态（最小化/退出时自动跳过，不会强行唤起）
FanModeSync=1
; ---- 电源滑块（Windows 电源模式）联动 ----
; 已并入主程序，不再需要额外运行 PowerModeSwitcher_v11_overlay.ahk
; 1 = 切到节能档时把电源模式滑块设为「最佳能效」，离开时恢复原值（无 UI、不抢焦点）
OverlaySync=1
; 哪一档视作节能：1=日常 2=游戏 3=静音
OverlayEcoMode=3
; 「最佳能效」GUID；留空用本机实测值 961cc777-2547-4f9d-8174-7d86181b8a7a
OverlayMinGuid=
; 日志保留天数，超过自动删除（默认 14）
LogKeepDays=14

[Mode1]
Name=日常
PowerPlanName=平衡
PowerPlanGuid=381b4222-f694-41f0-9685-ff5bb260df2e
NativeGuid=381b4222-f694-41f0-9685-ff5bb260df2e
TrayIcon=icon_sets\G_filled\icon_balanced_g6.ico
; GCC 风扇模式，四选一：
;   Quiet       静音
;   Performance 正常（默认曲线）
;   FullSpeed   全速（风扇拉满）
;   Custom      手动
; 留空 = 这一档不动风扇
FanMode=Performance

[Mode2]
Name=游戏
PowerPlanName=高性能
PowerPlanGuid=8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
NativeGuid=8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
TrayIcon=icon_sets\G_filled\icon_performance_g6.ico
; 游戏档也用「正常」曲线：全速太吵，且正常曲线在温度上来后本来就会加速
FanMode=Performance

[Mode3]
Name=静音
PowerPlanName=节能
PowerPlanGuid=a1841308-3541-4fab-bc81-f71556f20b4a
NativeGuid=a1841308-3541-4fab-bc81-f71556f20b4a
TrayIcon=icon_sets\G_filled\icon_powersave_g6.ico
FanMode=Quiet
